<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 한국어 10</title>
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --text: #2b2620;
    --muted: #8a8378;
    --accent: #c1440e;
    --accent-soft: #fbe9df;
    --border: #e8e3da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 80px;
  }
  h1 {
    font-size: 1.9rem;
    margin: 0 0 6px;
    letter-spacing: -0.5px;
  }
  .date {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 36px;
  }
  .grid {
    width: 100%;
    max-width: 760px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
  }
  .card-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }
  .speak-btn {
    margin-left: auto;
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1.05rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .speak-btn:hover {
    background: var(--accent);
    color: #fff;
  }
  .speak-btn:active {
    transform: scale(0.9);
  }
  .speak-btn.playing {
    background: var(--accent);
    color: #fff;
  }
  .index {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .word {
    font-size: 1.4rem;
    font-weight: 700;
  }
  .romanization {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .meaning {
    font-weight: 600;
    margin-bottom: 10px;
  }
  .example {
    border-top: 1px dashed var(--border);
    padding-top: 10px;
    font-size: 0.92rem;
    line-height: 1.5;
  }
  .example .kr {
    color: var(--text);
  }
  .example .en {
    color: var(--muted);
  }
  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 0.82rem;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <h1>💬 오늘의 실생활 한국어 10</h1>
  <div class="date" id="dateLabel"></div>

  <div class="grid" id="grid"></div>

  <footer>
    매일 자정마다 실생활에서 자주 쓰는 표현 10개로 자동으로 바뀝니다.
  </footer>

<script>
  const WORDS = [
    { kr: '안녕하세요', ro: 'annyeonghaseyo', en: 'Hello', ex: '누군가를 처음 만나거나 마주쳤을 때', exEn: 'When meeting or greeting someone' },
    { kr: '감사합니다', ro: 'gamsahamnida', en: 'Thank you', ex: '도움을 받았을 때 정중하게', exEn: 'Politely, when someone helps you' },
    { kr: '죄송합니다', ro: 'joesonghamnida', en: 'I\'m sorry (formal)', ex: '실수했거나 폐를 끼쳤을 때', exEn: 'When you made a mistake or caused trouble' },
    { kr: '실례합니다', ro: 'sillyehamnida', en: 'Excuse me', ex: '지나가거나 말을 걸기 전에', exEn: 'Before passing by or interrupting someone' },
    { kr: '잠깐만요', ro: 'jamkkanmanyo', en: 'Just a moment', ex: '잠시 기다려 달라고 할 때', exEn: 'Asking someone to wait a moment' },
    { kr: '괜찮아요', ro: 'gwaenchanayo', en: 'It\'s okay / I\'m fine', ex: '사과를 받아줄 때, 상태를 물을 때', exEn: 'Accepting an apology, or saying you\'re fine' },
    { kr: '얼마예요?', ro: 'eolmayeyo?', en: 'How much is it?', ex: '가게에서 가격을 물을 때', exEn: 'Asking the price at a shop' },
    { kr: '이거 주세요', ro: 'igeo juseyo', en: 'This one, please', ex: '물건을 살 때 가리키며', exEn: 'Pointing at something you want to buy' },
    { kr: '화장실이 어디예요?', ro: 'hwajangsiri eodiyeyo?', en: 'Where is the restroom?', ex: '급하게 화장실을 찾을 때', exEn: 'Looking for a restroom' },
    { kr: '여기요', ro: 'yeogiyo', en: 'Excuse me (calling someone)', ex: '식당에서 직원을 부를 때', exEn: 'Calling a server at a restaurant' },
    { kr: '잘 먹겠습니다', ro: 'jal meokgetseumnida', en: 'I will eat well', ex: '식사를 시작하기 전에', exEn: 'Said right before starting a meal' },
    { kr: '잘 먹었습니다', ro: 'jal meogeotseumnida', en: 'I ate well, thank you', ex: '식사를 마친 후에', exEn: 'Said after finishing a meal' },
    { kr: '배고파요', ro: 'baegopayo', en: 'I\'m hungry', ex: '배가 고플 때 표현', exEn: 'Expressing hunger' },
    { kr: '맛있어요', ro: 'masisseoyo', en: 'It\'s delicious', ex: '음식이 맛있을 때', exEn: 'When food tastes good' },
    { kr: '조심하세요', ro: 'josimhaseyo', en: 'Be careful', ex: '위험을 알리거나 주의를 줄 때', exEn: 'Warning someone to be careful' },
    { kr: '도와주세요', ro: 'dowajuseyo', en: 'Please help me', ex: '도움이 필요할 때', exEn: 'Asking for help' },
    { kr: '알겠습니다', ro: 'algetseumnida', en: 'I understand / Got it', ex: '지시나 설명을 이해했을 때', exEn: 'Confirming you understood something' },
    { kr: '잘 모르겠어요', ro: 'jal moreugesseoyo', en: 'I don\'t really know', ex: '확실하지 않을 때 대답', exEn: 'Answering when you\'re not sure' },
    { kr: '다시 말해 주세요', ro: 'dasi malhae juseyo', en: 'Please say that again', ex: '못 들었거나 이해 못했을 때', exEn: 'When you didn\'t catch what was said' },
    { kr: '천천히 말해 주세요', ro: 'cheoncheonhi malhae juseyo', en: 'Please speak slowly', ex: '말이 너무 빠를 때', exEn: 'When someone is speaking too fast' },
    { kr: '영어 할 줄 아세요?', ro: 'yeongeo hal jul aseyo?', en: 'Do you speak English?', ex: '언어 소통이 어려울 때', exEn: 'Checking if the other person speaks English' },
    { kr: '한국어를 잘 못해요', ro: 'hangugeoreul jal mothaeyo', en: 'I don\'t speak Korean well', ex: '한국어 실력을 미리 알릴 때', exEn: 'Letting someone know your Korean is limited' },
    { kr: '이름이 뭐예요?', ro: 'ireumi mwoyeyo?', en: 'What is your name?', ex: '처음 만난 사람에게', exEn: 'Asking someone\'s name when you first meet' },
    { kr: '반갑습니다', ro: 'bangapseumnida', en: 'Nice to meet you', ex: '첫 인사를 나눌 때', exEn: 'Said when greeting someone for the first time' },
    { kr: '오랜만이에요', ro: 'oraenmanieyo', en: 'Long time no see', ex: '오랫동안 못 본 사람에게', exEn: 'Greeting someone you haven\'t seen in a while' },
    { kr: '수고하셨습니다', ro: 'sugohasyeotseumnida', en: 'Thank you for your hard work', ex: '일이 끝난 뒤 인사', exEn: 'Said after work is finished' },
    { kr: '축하합니다', ro: 'chukhahamnida', en: 'Congratulations', ex: '좋은 일이 생겼을 때', exEn: 'When something good happens to someone' },
    { kr: '힘내세요', ro: 'himnaeseyo', en: 'Cheer up / Hang in there', ex: '힘든 사람을 응원할 때', exEn: 'Encouraging someone who\'s struggling' },
    { kr: '기다려 주세요', ro: 'gidaryeo juseyo', en: 'Please wait', ex: '잠시 기다려 달라고 요청할 때', exEn: 'Asking someone to wait' },
    { kr: '몇 시예요?', ro: 'myeot siyeyo?', en: 'What time is it?', ex: '시간을 물을 때', exEn: 'Asking for the current time' },
    { kr: '같이 가요', ro: 'gachi gayo', en: 'Let\'s go together', ex: '함께 가자고 제안할 때', exEn: 'Suggesting to go somewhere together' },
    { kr: '여기가 어디예요?', ro: 'yeogiga eodiyeyo?', en: 'Where is this place?', ex: '길을 잃었을 때', exEn: 'Asking where you currently are' },
    { kr: '길을 잃었어요', ro: 'gireul ireosseoyo', en: 'I\'m lost', ex: '길을 못 찾을 때', exEn: 'Telling someone you\'re lost' },
    { kr: '이거 얼마나 걸려요?', ro: 'igeo eolmana geollyeoyo?', en: 'How long does this take?', ex: '소요 시간을 물을 때', exEn: 'Asking how much time something takes' },
    { kr: '계산해 주세요', ro: 'gyesanhae juseyo', en: 'Check, please', ex: '식당에서 계산을 요청할 때', exEn: 'Asking for the bill at a restaurant' },
    { kr: '이거 얼마예요?', ro: 'igeo eolmayeyo?', en: 'How much is this?', ex: '특정 물건의 가격을 물을 때', exEn: 'Asking the price of a specific item' },
    { kr: '더 주세요', ro: 'deo juseyo', en: 'More, please', ex: '음식이나 물건을 더 요청할 때', exEn: 'Asking for more food or something' },
    { kr: '괜찮으세요?', ro: 'gwaenchaneuseyo?', en: 'Are you okay?', ex: '상대방의 상태를 물을 때', exEn: 'Checking if someone is alright' },
    { kr: '조금만요', ro: 'jogeummanyo', en: 'Just a little', ex: '양을 조금만 달라고 할 때', exEn: 'Asking for just a small amount' },
    { kr: '어디 가세요?', ro: 'eodi gaseyo?', en: 'Where are you going?', ex: '가벼운 안부 인사로', exEn: 'A casual, friendly greeting' },
  ];

  function dailySeed() {
    const now = new Date();
    return now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  }

  function seededRandom(seed) {
    let s = seed % 2147483647;
    if (s <= 0) s += 2147483646;
    return function () {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
  }

  function pickDailyWords() {
    const rand = seededRandom(dailySeed());
    const pool = WORDS.map((w, i) => ({ w, key: rand() + i * 0.0000001 }));
    pool.sort((a, b) => a.key - b.key);
    return pool.slice(0, 10).map(p => p.w);
  }

  function renderDate() {
    const now = new Date();
    const label = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일의 단어`;
    document.getElementById('dateLabel').textContent = label;
  }

  function render() {
    renderDate();
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    pickDailyWords().forEach((word, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <span class="index">${i + 1}</span>
          <span class="word">${word.kr}</span>
        </div>
        <div class="romanization">${word.ro}</div>
        <div class="meaning">${word.en}</div>
        <div class="example">
          <div class="kr">🗣️ ${word.ex}</div>
          <div class="en">${word.exEn}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  render();
</script>
</body>
</html>
